<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heal | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#D4AF37",
                        secondary: "#1A1A1A",
                        background: "#0A0A0A",
                        surface: "#111111",
                        textPrimary: "#F5F5F5",
                        textSecondary: "#A3A3A3",
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0A0A0A;
            color: #F5F5F5;
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: '"Playfair Display"', serif;
        }
    </style>
    <style>
        body { display: none; } /* Hide by default until auth verifies */
    </style>
    <script>
        const AUTH_URL = 'https://tbdmuznvuezgjjvlorhg.supabase.co/rest/v1/';
        const AUTH_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiZG11em52dWV6Z2pqdmxvcmhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NjM1NTMsImV4cCI6MjA5NDQzOTU1M30.L83DhdnmRNHovfubhbJUxqAlMOrkaYKoq-ET_hOwRXw';

        async function verifyAdmin() {
            const email = localStorage.getItem('saas_user_email');
            if(!email) {
                document.body.style.display = 'block';
                document.body.innerHTML = '<div class="h-screen flex items-center justify-center bg-background text-white flex-col"><h1 class="text-4xl font-serif mb-4 text-red-500">Access Denied</h1><p class="text-textSecondary text-lg mb-6">You must be logged in as an administrator.</p><a href="index.html" class="px-6 py-2 bg-primary text-black rounded-full hover:bg-white transition-colors">Return to Home</a></div>';
                return;
            }
            try {
                const res = await fetch(`${AUTH_URL}saas_users?email=eq.${email}`, {
                    headers: { 'apikey': AUTH_KEY, 'Authorization': `Bearer ${AUTH_KEY}` }
                });
                const users = await res.json();
                if(!users || users.length === 0 || users[0].role !== 'admin') {
                    document.body.style.display = 'block';
                    document.body.innerHTML = '<div class="h-screen flex items-center justify-center bg-background text-white flex-col"><h1 class="text-4xl font-serif mb-4 text-red-500">Access Denied</h1><p class="text-textSecondary text-lg mb-6">You do not have administrator privileges.</p><a href="index.html" class="px-6 py-2 bg-primary text-black rounded-full hover:bg-white transition-colors">Return to Home</a></div>';
                } else {
                    document.body.style.display = 'block';
                }
            } catch(e) {
                document.body.style.display = 'block';
                document.body.innerHTML = '<div class="h-screen flex items-center justify-center bg-background text-white flex-col"><h1 class="text-4xl font-serif mb-4 text-red-500">Connection Error</h1><p class="text-textSecondary text-lg">Failed to verify authentication.</p></div>';
            }
        }
        
        document.addEventListener('DOMContentLoaded', verifyAdmin);
    </script>
</head>
<body class="antialiased min-h-screen pt-12 pb-12 px-4 bg-background">

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-serif text-white mb-2">Admin Dashboard</h1>
                <p class="text-textSecondary">Manage your appointments and revenue.</p>
            </div>
            <a href="index.html" class="text-primary border border-primary px-6 py-2 rounded-full hover:bg-primary hover:text-black transition-colors">
                Back to Site
            </a>
        </div>

        <!-- Stats Grid -->
        <div class="grid md:grid-cols-3 gap-6 mb-12">
            <div class="bg-surface border border-white/10 p-6 rounded-2xl">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-primary/10 rounded-lg text-primary"><i class="fas fa-calendar-alt text-2xl"></i></div>
                    <span class="text-green-400 text-sm font-medium">+12%</span>
                </div>
                <h3 class="text-textSecondary text-sm mb-1">Total Bookings</h3>
                <p class="text-3xl font-serif text-white" id="stat-total-bookings">0</p>
            </div>
            
            <div class="bg-surface border border-white/10 p-6 rounded-2xl">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-primary/10 rounded-lg text-primary"><i class="fas fa-chart-line text-2xl"></i></div>
                    <span class="text-green-400 text-sm font-medium">+8%</span>
                </div>
                <h3 class="text-textSecondary text-sm mb-1">Total Revenue</h3>
                <p class="text-3xl font-serif text-white" id="stat-total-revenue">$0</p>
            </div>
            
            <div class="bg-surface border border-white/10 p-6 rounded-2xl">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-primary/10 rounded-lg text-primary"><i class="fas fa-spa text-2xl"></i></div>
                    <span class="text-textSecondary text-sm font-medium">This Month</span>
                </div>
                <h3 class="text-textSecondary text-sm mb-1">Active Services</h3>
                <p class="text-3xl font-serif text-white">2</p>
            </div>
        </div>

        <!-- Bookings List -->
        <div class="bg-surface border border-white/10 rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h2 class="text-2xl font-serif text-white">Recent Appointments</h2>
            </div>
            
            <div id="no-bookings-msg" class="p-12 text-center text-textSecondary hidden">
                <i class="fas fa-calendar-alt text-4xl mx-auto mb-4 opacity-50 block"></i>
                <p>No appointments booked yet. Try making a mock booking on the site!</p>
            </div>
            
            <div id="bookings-table-container" class="overflow-x-auto hidden">
                <table class="w-full text-left">
                    <thead class="bg-black/50 text-textSecondary text-sm">
                        <tr>
                            <th class="p-4 font-medium">Customer</th>
                            <th class="p-4 font-medium">Contact</th>
                            <th class="p-4 font-medium">Service</th>
                            <th class="p-4 font-medium">Schedule</th>
                            <th class="p-4 font-medium">Status</th>
                            <th class="p-4 font-medium text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/5" id="bookings-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tbdmuznvuezgjjvlorhg.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiZG11em52dWV6Z2pqdmxvcmhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NjM1NTMsImV4cCI6MjA5NDQzOTU1M30.L83DhdnmRNHovfubhbJUxqAlMOrkaYKoq-ET_hOwRXw';

        async function renderAdminDashboard() {
            let bookings = [];
            try {
                const res = await fetch(`${SUPABASE_URL}bookings?order=bookedAt.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if(res.ok) {
                    bookings = await res.json();
                }
            } catch (e) {
                console.error("Failed to fetch bookings", e);
            }

            const noBookingsMsg = document.getElementById('no-bookings-msg');
            const tableContainer = document.getElementById('bookings-table-container');
            const tbody = document.getElementById('bookings-tbody');

            // Update stats
            document.getElementById('stat-total-bookings').innerText = bookings.length;
            const totalRevenue = bookings.reduce((sum, b) => sum + (b.price || 0), 0);
            document.getElementById('stat-total-revenue').innerText = `₹${totalRevenue}`;

            if (bookings.length === 0) {
                noBookingsMsg.classList.remove('hidden');
                tableContainer.classList.add('hidden');
            } else {
                noBookingsMsg.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                
                tbody.innerHTML = '';
                bookings.forEach(booking => {
                    const dateBooked = new Date(booking.bookedAt).toLocaleDateString();
                    const initial = booking.customerName ? booking.customerName.charAt(0).toUpperCase() : 'G';
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-white/5 transition-colors";
                    tr.innerHTML = `
                        <td class="p-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-primary/20 text-primary flex items-center justify-center font-serif font-bold">
                                    ${initial}
                                </div>
                                <div>
                                    <p class="text-white font-medium">${booking.customerName}</p>
                                    <p class="text-textSecondary text-xs">Booked: ${dateBooked}</p>
                                </div>
                            </div>
                        </td>
                        <td class="p-4 text-sm">
                            <div class="flex items-center gap-2 text-textSecondary mb-1"><i class="fas fa-phone text-xs"></i> ${booking.customerPhone}</div>
                            <div class="flex items-center gap-2 text-textSecondary"><i class="fas fa-map-marker-alt text-xs"></i> <span class="truncate max-w-[150px]" title="${booking.customerAddress}">${booking.customerAddress}</span></div>
                        </td>
                        <td class="p-4">
                            <p class="text-white text-sm">${booking.service}</p>
                            <p class="text-primary font-serif text-sm">₹${booking.price}</p>
                        </td>
                        <td class="p-4">
                            <div class="bg-black/50 border border-white/10 rounded-lg p-2 inline-block">
                                <p class="text-white text-sm font-medium">${booking.date}</p>
                                <p class="text-primary text-xs flex items-center gap-1"><i class="fas fa-clock text-[10px]"></i> ${booking.time}</p>
                            </div>
                        </td>
                        <td class="p-4">
                            <span class="inline-flex items-center gap-1 bg-green-500/10 text-green-400 text-xs px-2 py-1 rounded-full border border-green-500/20">
                                <i class="fas fa-check-circle text-[10px]"></i> Confirmed
                            </span>
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="deleteBooking('${booking.id}', '${booking.date}', '${booking.time}')" class="text-red-400 hover:text-red-300 transition-colors" title="Cancel Booking">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // Added functionality to delete/cancel a booking for the demo
        async function deleteBooking(id, date, time) {
            if(confirm("Are you sure you want to cancel this booking?")) {
                try {
                    await fetch(`${SUPABASE_URL}bookings?id=eq.${id}`, {
                        method: 'DELETE',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    renderAdminDashboard();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        // Run on load
        renderAdminDashboard();
    </script>
</body>
</html>
